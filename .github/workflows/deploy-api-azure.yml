name: Deploy API (Azure App Service)

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api-azure.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --dev

      - name: Ruff check
        working-directory: apps/api
        run: uv run ruff check .

      - name: Mypy
        working-directory: apps/api
        run: uv run mypy app tests

      - name: Pytest
        working-directory: apps/api
        run: uv run pytest

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_WEBAPP_PUBLISH_PROFILE }}
          package: apps/api
