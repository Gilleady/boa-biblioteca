repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -lc 'cd apps/api && uv run ruff check .'
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: bash -lc 'cd apps/api && uv run ruff format --check .'
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: bash -lc 'cd apps/api && uv run mypy app tests'
        language: system
        types: [python]
        pass_filenames: false
        files: ^apps/api/